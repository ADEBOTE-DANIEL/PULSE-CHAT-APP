services:
  - type: web
    name: pulse-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: web
    plan: free
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: CORS_ORIGINS
        value: "*"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: pulse-db
    plan: free