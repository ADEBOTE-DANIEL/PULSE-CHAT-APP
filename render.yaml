services:
  - type: web
    name: pulse-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: web
    plan: free
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: CORS_ORIGINS
        value: "*"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: pulse-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: pulse-redis
          type: redis
          property: port
      - key: CELERY_BROKER_URL
        fromService:
          name: pulse-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: pulse-redis
          type: redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: pulse-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: worker
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: pulse-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: pulse-redis
          type: redis
          property: port
      - key: CELERY_BROKER_URL
        fromService:
          name: pulse-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: pulse-redis
          type: redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: redis
    name: pulse-redis
    plan: free
    ipAllowList: []

databases:
  - name: pulse-db
    plan: free